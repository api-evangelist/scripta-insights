summary: >-
  Scripta Insights publishes its security, privacy and compliance posture as prose on a
  single public page. It claims HIPAA compliance and a SOC 2 attestation (AICPA SOC badge),
  and describes encryption at rest and in transit, anti-virus, vulnerability scanning,
  periodic penetration testing, formal access management, secure SDLC and a dedicated
  product security incident response team. No machine-readable contract is published, so no
  standards conformance can be asserted from a spec — every entry below is either a
  documented claim or an honest false.
sector: healthcare
regulatory_regime: hipaa

