domain_standards:
  note: >-
    REWARD-ONLY. Scripta's market — pharmacy benefits — has real domain standards that a
    contract could declare: NCPDP SCRIPT and NCPDP Telecommunication D.0 for e-prescribing
    and pharmacy claims, X12 835/837 for claims and remittance, X12 834 for benefit
    enrollment and eligibility maintenance, and HL7 FHIR R4 (US Core, Da Vinci PDex
    formulary) for EHR and formulary exchange. Scripta's own technology page describes
    ingesting monthly claims and eligibility feeds from PBMs and integrating with EHR and
    pharmacy systems, which is exactly the surface these standards cover.
  declared: []
  evidence:
    url: https://www.scriptainsights.com/technology
    status: 200
    note: >-
      NO domain standard is declared anywhere publicly — not in a contract, and not in
      prose. Scripta publishes no machine-readable contract at all, so there is nothing to
      inspect for an NCPDP, X12 or FHIR signature. Recorded as absent, not as failing.
