    url: https://www.scriptainsights.com/security
    quote: HIPAA Compliant (badge displayed on the Security page)
    note: >-
      Consistent with the business model — Scripta ingests pharmacy claims and eligibility
      feeds from PBMs on behalf of self-insured plan sponsors, which is PHI.
