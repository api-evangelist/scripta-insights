aid: scripta-insights
name: Scripta Insights
description: >-
  Scripta Insights is a Boston-founded healthcare technology company that sells pharmacy
  benefit cost containment to self-insured employers, health plans, TPAs and benefits
  consultants. Its doctor-driven Rx Navigation platform layers on top of an existing plan
  design and PBM contract — no PBM change, no benefit redesign — and is built on two
  proprietary engines: Med Mapper, which maps nearly every drug on the market to safe,
  evidence-based clinical alternatives, and Rx Savings Mapper, which prices those
  alternatives against the employer's own plan design, formulary, PBM contract and recent
  patient claims. Members receive personalized savings reports; plan sponsors receive
  utilization and savings reporting, fiduciary-compliance support, a GLP-1 Navigator and a
  Provider Navigator prescribing tool. Scripta integrates with cash-pay channels including
  Mark Cuban Cost Plus Drugs, RxSaveCard and Precision Coupons, and offers customer
  integration by SSO, an API-only connection, white-label, simple HTTP redirect or a data
  partner model — none of which is publicly documented.
