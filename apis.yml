apis:
- name: Scripta Insights Site MCP
  description: >-
    A live, anonymous Model Context Protocol endpoint served from the Scripta Insights
    marketing host and advertised in the company's own /llms.txt. It is the stock Wix Site
    MCP server (platform-authored, not written by Scripta): nine tools that read public
    site content and business details and call Wix business-solution REST APIs on a
    visitor's behalf. It does not expose the Rx Navigation platform, Med Mapper, Rx Savings
    Mapper, claims, eligibility or any member data.
  humanURL: https://www.scriptainsights.com/llms.txt
